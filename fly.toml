# Fly.io:  fly launch --no-deploy --copy-config  ->   fly secrets set BOT_TOKEN=... (see DEPLOY.md)   ->   fly deploy
app = "mgbmusic"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "bash start"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
